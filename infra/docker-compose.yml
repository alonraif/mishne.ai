# Local development only. Production Postgres is RDS Multi-AZ — see
# docs/architecture/03-platform-and-data.md.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mishne
      POSTGRES_PASSWORD: mishne
      POSTGRES_DB: mishne
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishne"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage. The browser uploads presigned multipart straight to it and
  # the worker reads media back out, so without this the first thing anyone
  # clicks has nowhere to put a file. Production is S3; this is the same API.
  #
  # `s3_endpoint_url` in the API's settings is what points at it, and the
  # validator refuses that override outside `environment=local` — an endpoint
  # override anywhere else means customer media is going somewhere nobody
  # audited (ADR-0012).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # 9000 is the S3 API the app and the browser talk to; the console is a web
      # UI for looking at what actually landed, which is the fastest way to tell
      # a broken upload from a broken database row.
      #
      # The console is published on 9101 rather than 9001 because Avid Media
      # Composer's EditorTranscode service runs an HSQLDB server on 9001, as
      # root, from launch. A machine with Media Composer installed — which is
      # every machine that can answer A2 — cannot start this container on the
      # old port, and the error names only the port, not what holds it. The
      # container still listens on 9001 internally; only the host mapping moved.
      - "9000:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
