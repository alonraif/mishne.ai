<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The brand mark, mirrored from src/components/logo.tsx: three bars of
    decreasing width, on the same 20x20 grid inset by 6.

    Two deliberate differences from the component. It sits on a filled ground
    rather than transparent, so it stays visible against a light tab bar and a
    dark one alike. And the colours are literal: a favicon renders outside the
    document and cannot read the @theme tokens, so #7183f5 is oklch(0.65 0.17
    274) — the dark theme's --primary — resolved by hand. Change both files in
    the same commit.
  -->
  <rect width="32" height="32" rx="7" fill="#7183f5"/>
  <rect x="7" y="9" width="18" height="3" rx="1.5" fill="#fff"/>
  <rect x="7" y="14.5" width="11" height="3" rx="1.5" fill="#fff" fill-opacity=".72"/>
  <rect x="7" y="20" width="5" height="3" rx="1.5" fill="#fff" fill-opacity=".45"/>
</svg>
