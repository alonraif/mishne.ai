[project]
name = "mishne-api"
version = "0.0.0"
description = "mishne.ai API and edit pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Pulled in once the pipeline is real. Kept separate so the API image stays small.
media = [
    "opentimelineio>=0.17",
    "pyaaf2>=1.7",
    "ffmpeg-python>=0.2",
]
solver = ["ortools>=9.11"]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mishne"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Fixture prose. A transcript line rewrapped to 100 columns is unreadable, and
# it diffs badly against apps/web/src/lib/mock-transcript.ts, which these lines
# have to stay in step with.
"src/mishne/mock.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
