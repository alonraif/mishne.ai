[project]
name = "mishne-api"
version = "0.0.0"
description = "mishne.ai API and edit pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Pulled in once the pipeline is real. Kept separate so the API image stays small.
media = [
    "opentimelineio>=0.17",
    "pyaaf2>=1.7",
    "ffmpeg-python>=0.2",
]
solver = ["ortools>=9.11"]
# Taking money. Optional because `payment_provider="fake"` implements the same
# contract — signature verification included — so the whole purchase and
# webhook path is testable without an account, a key or a network.
payments = ["stripe>=11.0"]
# Traces. Optional on purpose: `telemetry.py` degrades to no-op spans when the
# SDK is absent, because a worker that will not start because a telemetry
# package is missing is a worse outcome than a worker with no telemetry. The
# exporter is chosen by settings, so no vendor appears here either.
telemetry = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# `moto` gives the storage tests a real S3 protocol implementation in-process,
# so the suite never needs AWS credentials or a network.
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13", "moto[s3]>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mishne"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Fixture prose. A transcript line rewrapped to 100 columns is unreadable, and
# it diffs badly against apps/web/src/lib/mock-transcript.ts, which these lines
# have to stay in step with.
"src/mishne/mock.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    # Renders real media end to end. Only reachable when a sample is present,
    # so `-m "not slow"` is for the case where one is and you are in a hurry.
    "slow: minutes, not seconds — renders real media",
]
