# Alembic configuration for mishne.ai.
#
# The database URL is NOT set here. env.py reads it from mishne.config, so the
# migration runner and the application can never disagree about which database
# they are pointed at. Override for a one-off with:
#
#     DATABASE_URL=... alembic upgrade head
#
# Migrations connect as the OWNER role. The application connects as the
# restricted `mishne_app` role, which is subject to row-level security.
# See migrations/README.md.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
